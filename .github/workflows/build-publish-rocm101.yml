name: Build and Publish Docling Serve ROCm 10.1 Image

on:
  push:
    branches:
      - rocm10.1
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docling Serve ROCm 10.1 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          build-args: |
            UV_SYNC_EXTRA_ARGS=--no-group pypi --group rocm101 --no-extra flash-attn
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/docling-serve-rocm101:main
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/docling-serve-rocm101:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
